include:
  # Core role titles
  - "bioinformatic(?:s|ian|ist)"  # matches bioinformatics/bioinformatician/bioinformaticist
  - "computational biolog(?:y|ists?)"  # matches computational biology/biologist/biologists
  - "clinical bioinformatics"
  - "genomics data scientist"
  - "genomics data engineer"
  # Domain/clinical NGS
  - "hybrid capture"
  - "targeted sequencing"
  - "CNV calling"
  - "fusion[- ]?(calling|detection)"
  - translocation
  - MSI
  - TMB
  - HRD
  - "liquid biopsy"
  - cfDNA
  - FFPE
  - "oncology NGS"
  - "clinical genomics"
  - "variant calling"
  - "somatic variant"
  - NGS
  - "next[- ]generation sequencing"
  - "single[- ]cell"
  - transcriptomics
  # Pipeline/infra
  - "common workflow language"
  - CWL
  - Nextflow
  - "AWS HealthOmics"
  - "bioinformatics pipeline"
  - "pipeline architect"
  # Tools (recruiter/ATS keyword-matched)
  - GATK
  - Mutect2
  - PureCN
  - CNVkit
  - BWA
  - STAR
  # Other domains
  - microbiome
  - metagenomics
  - "comparative genomics"
  - "antibiotic resistance"
  - "experimental evolution"
  - "regulatory genomics"
  - "transcription factor binding"
exclude:
  - "data entry"
# Title phrases that mark a posting as a non-bioinformatics function. When the title
# doesn't itself match an `include` keyword, one of these skips the description
# fallback — otherwise a company's "About Us"/benefits boilerplate mentioning a keyword
# (e.g. "...expertise in NGS...") would make a Sales or Marketing posting relevant.
off_topic_titles:
  - sales
  - "account executive"
  - marketing
  - "business development"
  - "investor relations"
  - "communications manager"
  - recruiter
  - "talent acquisition"
  - "human resources"
  - "mechanical engineer"
match_fields: [title, description]
case_sensitive: false
