[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "job-scraper"
version = "0.1.0"
description = "Personal bioinformatics job search scraper"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "catboost>=1.2.10",
    "einops>=0.8.2",
    "ipython>=9.15.0",
    "joblib>=1.5.3",
    "marimo>=0.23.13",
    "nltk>=3.10.0",
    "numpy>=1.26.3",
    "optuna>=4.9.0",
    "pandas>=2.3.3",
    "python-jobspy>=1.1.82",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.16.3",
    "sentence-transformers>=3.0",
    "torch>=2.13.0",
    "transformers>=5.3.0",
]

[tool.setuptools.packages.find]
include = ["job_scraper*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.marimo.runtime]
dotenv = [".env"]