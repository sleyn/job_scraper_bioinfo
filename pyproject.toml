[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "job-scraper"
version = "0.1.0"
description = "Personal bioinformatics job search scraper"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pandas>=2.3.3",
    "python-jobspy>=1.1.82",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[tool.setuptools.packages.find]
include = ["job_scraper*"]
