[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "job-scraper"
version = "0.1.0"
description = "Personal bioinformatics job search scraper"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "einops>=0.8.2",
    "joblib>=1.5.3",
    "numpy>=1.26.3",
    "optuna>=4.9.0",
    "pandas>=2.3.3",
    "python-jobspy>=1.1.82",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.16.3",
    "sentence-transformers>=3.0",
    "torch>=2.13.0",
    "transformers>=5.3.0",
]

[project.optional-dependencies]
# Only used by the thinking_space/score_jd/score.py marimo notebook — never imported by
# job_scraper itself, so the Airflow image (Dockerfile) installs the package without this
# extra to avoid pulling ~3 unused packages into the scoring container.
notebook = [
    "catboost>=1.2.10",
    "ipython>=9.15.0",
    "marimo>=0.23.13",
    "nltk>=3.10.0",
    "seaborn>=0.13.2",
]

[tool.setuptools.packages.find]
include = ["job_scraper*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.marimo.runtime]
dotenv = [".env"]