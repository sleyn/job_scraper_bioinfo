x-airflow-common-env: &airflow-common-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
  # Must be identical across webserver/scheduler: the webserver fetches task logs from
  # the scheduler's log-serving endpoint over HTTP, authenticated with this key. Left
  # unset, each container generates its own random default and that fetch 403s.
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?set AIRFLOW_SECRET_KEY in .env}
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  JOB_SCRAPER_CONFIG_DIR: /opt/airflow/config
  JOB_SCRAPER_DB_PATH: /opt/airflow/data/jobs.db
  # Container-side paths for the two career-history files the scoring task reads. The
  # host-side locations are the ${JOB_HELPER_*} values in .env; the bind mounts below
  # map those onto these fixed in-container paths, so the container never depends on
  # AI_Job_Helper's layout on this machine. JOB_HELPER_JD_SCORES_CSV is deliberately
  # absent: only train_export.py needs it, and that runs on the host, not in Airflow.
  JOB_HELPER_MEMORY_PATH: /opt/airflow/career/MEMORY.md
  JOB_HELPER_RESUME_PATH: /opt/airflow/career/resume.md
  # The embedding model is ~500MB and would otherwise be re-fetched on every cold
  # container start. The host cache is mounted below; offline mode pins the load to it
  # and keeps the container off the Hub entirely, so a scoring run needs no network.
  HF_HOME: /opt/airflow/hf-cache
  HF_HUB_OFFLINE: "1"

x-airflow-common: &airflow-common
  build: .
  environment:
    <<: *airflow-common-env
  volumes:
    - ./dags:/opt/airflow/dags
    - ./config:/opt/airflow/config
    - ./data:/opt/airflow/data
    # Read-only mounts of the two files scoring needs from the sibling AI_Job_Helper
    # project. Compose fails to start if either var is unset in .env — which is the
    # intent: the scoring task would otherwise fail at runtime instead.
    - ${JOB_HELPER_MEMORY_PATH:?set JOB_HELPER_MEMORY_PATH in .env}:/opt/airflow/career/MEMORY.md:ro
    - ${JOB_HELPER_RESUME_PATH:?set JOB_HELPER_RESUME_PATH in .env}:/opt/airflow/career/resume.md:ro
    # HuggingFace cache, read-write: offline mode still writes lock files on load, and a
    # read-only mount makes that fail. Populate it on the host first (any local scoring or
    # training run does), since HF_HUB_OFFLINE=1 turns a cache miss into an error, not a
    # download.
    - ${HF_HOME:-~/.cache/huggingface}:/opt/airflow/hf-cache
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - "mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/config /opt/airflow/data && exec /entrypoint airflow version"
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      _AIRFLOW_WWW_USER_FIRSTNAME: Admin
      _AIRFLOW_WWW_USER_LASTNAME: User
      _AIRFLOW_WWW_USER_EMAIL: admin@example.com

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      JOB_SCRAPER_DB_PATH: /opt/web/data/jobs.db
    volumes:
      - ./data:/opt/web/data
    ports:
      - "5050:5000"
    restart: unless-stopped

volumes:
  postgres-db-volume:
